name: Tutorial

# The tutorial, replayed against the TeamRunner on PyPI: what a visitor installs today.
# On every change to the site, every Monday (a new release could break it), and by hand.
# Every run is a rehearsal: no model is called and no key is needed.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tutorial:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install TeamRunner from PyPI
        run: python -m pip install teamrunner
      - name: Replay the tutorial
        run: python tests/test_tutorial.py
